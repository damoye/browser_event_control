<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { width: 260px; margin: 0; padding: 12px; font: 13px/1.6 system-ui, sans-serif; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .master { display: flex; align-items: center; gap: 6px; padding: 8px; margin-bottom: 10px;
            background: #f2f5f9; border-radius: 6px; font-weight: 600; cursor: pointer; }
  ul { list-style: none; margin: 0 0 10px; padding: 0; }
  li { display: flex; align-items: center; justify-content: space-between; padding: 3px 4px; }
  li code { flex: 1; }
  button { border: 0; background: none; cursor: pointer; color: #999; font-size: 14px; padding: 0 4px; }
  button:hover { color: #d33; }
  .add { display: flex; gap: 6px; }
  input[type=text] { flex: 1; padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; font: inherit; }
  .add button { color: #fff; background: #3b6ef5; border-radius: 4px; padding: 4px 10px; }
  .add button:hover { background: #2a5ad8; color: #fff; }
  .hint { color: #888; margin-top: 8px; font-size: 12px; }
</style>
</head>
<body>
  <h1>事件屏蔽</h1>
  <label class="master"><input type="checkbox" id="enabled"> 总开关</label>
  <ul id="list"></ul>
  <div class="add">
    <input type="text" id="name" list="presets" placeholder="事件名，如 online">
    <datalist id="presets">
      <option>blur</option><option>focus</option><option>visibilitychange</option>
      <option>pagehide</option><option>pageshow</option><option>freeze</option><option>resume</option>
    </datalist>
    <button id="add">添加</button>
  </div>
  <p class="hint">改动即时生效。自定义事件需刷新页面后才完全可靠。</p>
  <script src="popup.js"></script>
</body>
</html>
